[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyei"
version = "1.1.4"
description = "A package for rpv and ecological inference"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Metric Geometry and Gerrymandering Group"}
]
license = {file = "LICENSE"}
keywords = ["ecological inference", "statistics", "bayesian"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics"
]

dependencies = [
    # Core scientific computing
    "numpy==2.2.6",
    "scipy==1.15.3",
    "pandas==2.3.2",
    "matplotlib==3.10.6",
    "seaborn==0.13.2",
    
    # Machine learning
    "scikit-learn==1.7.2",
    
    # Bayesian inference and probabilistic programming
    "pymc==5.25.1",
    "arviz==0.22.0",
    "pytensor==2.31.7",
    
    # JAX ecosystem for high-performance computing
    "jax==0.6.2",
    "jaxlib==0.6.2",
    "numpyro==0.19.0",
    
    # Numerical computation acceleration
    "numba==0.61.2",
    
    # Data I/O and visualization
    "netCDF4==1.7.2",
    "h5netcdf==1.6.4",
    "h5py==3.14.0",
    "xarray==2025.6.1",
    "xarray-einstats==0.8.0",
    "graphviz==0.21",
    
    # Utilities
    "tqdm==4.67.1",
]

[project.urls]
Homepage = "https://github.com/mggg/ecological-inference"
Repository = "https://github.com/mggg/ecological-inference"
Issues = "https://github.com/mggg/ecological-inference/issues"

[tool.hatch.build.targets.wheel]
packages = ["pyei"]

[tool.ruff.lint]
# by default, ruff enables all F and a subset of E rules
# for a description of rulesets and examples, see:
# https://docs.astral.sh/ruff/rules/
extend-select = [
  "B",      # bugbear - identifies likely bugs
  "D",      # pydocstyle - requires docstrings on all public modules/functions/classes
  "I",      # isort
  "UP",     # pyupgrade - requires preferred syntax in newer python versions
]

ignore = [
  "D415",   # allow first line of docstrings to end without punctuation
  "D417",   # Missing argument descriptions docstring for `__init__`: `**kwargs`, `*args`
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"test/*.py" = [
  "D103",   # missing docstring on test functions — names are self-documenting
]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "slow: tests that run MCMC/Gibbs sampling (>5s)",
  "mcmc: tests that exercise PyMC/numpyro samplers",
]
filterwarnings = [
  "default",
  "ignore::DeprecationWarning:pymc.*",
  "ignore::FutureWarning:arviz.*",
]

[tool.coverage.run]
source = ["pyei"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[tool.pyright]
# pytensor.tensor re-exports many names (TensorVariable, arange, as_tensor,
# transpose, etc.) that aren't listed in its `__all__`. They are the canonical
# public API — silence the false positives.
reportPrivateImportUsage = "none"

[[tool.mypy.overrides]]
# These libraries don't ship type stubs and don't carry a py.typed marker.
module = ["numba", "numba.*", "pymc", "pymc.*", "sklearn", "sklearn.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    # Code quality and linting
    "ruff==0.12.12",
    "mypy==1.17.1",
    "ty>=0.0.37",
    "pyright>=1.1.409",
    # Testing framework
    "pytest==8.4.2",
    "pytest-cov==6.3.0",
    # Development tools
    "pre-commit==4.3.0",
    # Jupyter notebook support
    "jupyter==1.1.1",
    "ipykernel",
    "ipywidgets==8.1.5",
    "pandas-stubs>=3.0.0.260204",
    "scipy-stubs>=1.17.1.4",
    "types-seaborn>=0.13.2.20260509",
    "types-tqdm>=4.67.3.20260508",
]

docs = [
    # Documentation tools
    "sphinx",
    "sphinx-rtd-theme",
    "myst-parser",
    "nbsphinx",
    "sphinx-autodoc-typehints",
]
